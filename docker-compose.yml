services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 1.8G
    ports:
      - "9200:9200"
    networks:
      - purple-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=purple_team_homelab_encryption_key_32chars_min
      - XPACK_REPORTING_ENCRYPTIONKEY=purple_team_homelab_encryption_key_32chars_min
      - XPACK_SECURITY_ENCRYPTIONKEY=purple_team_homelab_encryption_key_32chars_min
    deploy:
      resources:
        limits:
          memory: 800M
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - purple-net

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    environment:
      - NODE_ENV=development
    deploy:
      resources:
        limits:
          memory: 400M
    ports:
      - "3000:3000"
    networks:
      - purple-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    privileged: true
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:z
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      - elasticsearch
    networks:
      - purple-net

networks:
  purple-net:
    driver: bridge
